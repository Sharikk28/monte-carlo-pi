name: pi

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - api1
      - api2

  api1:
    build: ./api
    env_file: config.env
    restart: unless-stopped
    environment:
      API_NAME: api1
    depends_on:
      db:
        condition: service_healthy

  api2:
    build: ./api
    env_file: config.env
    restart: unless-stopped
    environment:
      API_NAME: api2
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pi
      POSTGRES_PASSWORD: pi_db_password
      POSTGRES_DB: pi
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pi -d pi"]
      interval: 2s
      timeout: 3s
      retries: 30

  worker1:
    build: ./worker
    image: pi-worker
    hostname: worker1
    env_file: config.env
    restart: unless-stopped
    environment:
      WORKER_NAME: worker1
    depends_on:
      db:
        condition: service_healthy

  worker2:
    build: ./worker
    image: pi-worker
    hostname: worker2
    env_file: config.env
    restart: unless-stopped
    environment:
      WORKER_NAME: worker2
    depends_on:
      db:
        condition: service_healthy

  scaler:
    build: ./scaler
    env_file: config.env
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy
      worker1:
        condition: service_started

volumes:
  dbdata:
